# 로컬에서 Campus API 실행:  docker compose up --build   →  http://localhost:8000/docs
services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      CAMPUS_ADMIN_TOKEN: ${CAMPUS_ADMIN_TOKEN:-dev-token}
      CAMPUS_CORS_ORIGINS: '["http://localhost:5173"]'
    volumes:
      - ./web/public/data:/app/data # 관리자 변경 후 지도 산출물 저장
      - ./backend/data:/app/backend/data # 원본 JSON 및 로컬 관리자 계정
      - api-data:/app/var # SQLite (편집 내용·이벤트)

volumes:
  api-data:
