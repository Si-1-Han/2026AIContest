name: Deploy (EC2)

# main 브랜치에 push → 이미지 3개 빌드(타입 검사·Vite 빌드 포함)·GHCR 업로드 → EC2에서 교체·헬스체크·실패 시 롤백.
# 수동 실행(Actions 탭 → Deploy (EC2) → Run workflow)도 main에서만 동작한다.
# 문서·AI 로그만 바뀐 커밋은 배포하지 않는다.
#
# CI 성공 후에만 배포하려면 on: 을 아래로 바꾸고 prepare의 if에 conclusion == 'success' 조건을 넣는다.
#   workflow_run: { workflows: [CI], types: [completed], branches: [main] }
#
# 필요한 설정 (Settings → Secrets and variables → Actions)
#   Secrets   EC2_HOST, EC2_USER, EC2_SSH_KEY            (필수)
#             ANTHROPIC_API_KEY, CAMPUS_ADMIN_TOKEN       (선택)
#             EC2_KNOWN_HOSTS                             (선택, 없으면 접속 시 호스트 키를 받아 씀)
#   Variables SITE_ADDRESS (도메인 → HTTPS), SITE_URL (표시용), EC2_PLATFORM (기본 linux/amd64), EC2_SSH_PORT
# 자세한 절차: docs/DEPLOY_EC2.md

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  prepare:
    name: 배포 대상 확인
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    outputs:
      sha: ${{ steps.meta.outputs.sha }}
      prefix: ${{ steps.meta.outputs.prefix }}
      latest: ${{ steps.meta.outputs.latest }}
    steps:
      - id: meta
        env:
          SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          # GHCR 이미지 이름은 소문자여야 한다 (Si-1-Han/2026AIContest → si-1-han/2026aicontest)
          echo "prefix=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          # 연달아 push했을 때 옛 커밋이 최신 배포를 덮어쓰지 않도록, 지금 main의 최신 커밋인지 확인
          HEAD=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [ "$HEAD" = "$SHA" ]; then echo "latest=true" >> "$GITHUB_OUTPUT"
          else echo "latest=false" >> "$GITHUB_OUTPUT"; echo "::notice::$SHA 는 main 최신이 아니라 건너뜁니다 (최신: $HEAD)."; fi

  build:
    name: 이미지 빌드 (${{ matrix.name }})
    needs: prepare
    if: needs.prepare.outputs.latest == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - { name: api, file: backend/Dockerfile, target: "" }
          - { name: site, file: web/Dockerfile, target: site }
          - { name: guide, file: web/Dockerfile, target: guide }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: docker/setup-qemu-action@v3
        if: vars.EC2_PLATFORM && vars.EC2_PLATFORM != 'linux/amd64'
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          platforms: ${{ vars.EC2_PLATFORM || 'linux/amd64' }}
          push: true
          tags: |
            ${{ needs.prepare.outputs.prefix }}-${{ matrix.name }}:${{ needs.prepare.outputs.sha }}
            ${{ needs.prepare.outputs.prefix }}-${{ matrix.name }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.prepare.outputs.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max

  deploy:
    name: EC2 배포
    needs: [prepare, build]
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.SITE_URL }}
    env:
      APP_DIR: /opt/hansei-campus
      SSH_PORT: ${{ vars.EC2_SSH_PORT || '22' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          sparse-checkout: deploy

      - name: 필수 Secrets 확인
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          missing=""
          for v in EC2_HOST EC2_USER EC2_SSH_KEY; do [ -n "${!v}" ] || missing="$missing $v"; done
          if [ -n "$missing" ]; then echo "::error::GitHub Secrets가 없습니다:$missing (docs/DEPLOY_EC2.md 참고)"; exit 1; fi

      - name: SSH 준비
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/ec2 && chmod 600 ~/.ssh/ec2
          if [ -n "$EC2_KNOWN_HOSTS" ]; then printf '%s\n' "$EC2_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else ssh-keyscan -p "$SSH_PORT" -T 15 "$EC2_HOST" > ~/.ssh/known_hosts 2>/dev/null; fi
          cat > ~/.ssh/config <<EOF
          Host ec2
            HostName $EC2_HOST
            User ${{ secrets.EC2_USER }}
            Port $SSH_PORT
            IdentityFile ~/.ssh/ec2
            ServerAliveInterval 30
          EOF

      - name: 운영 환경변수(.env) 작성
        env:
          IMAGE_PREFIX: ${{ needs.prepare.outputs.prefix }}
          IMAGE_TAG: ${{ needs.prepare.outputs.sha }}
          SITE_ADDRESS: ${{ vars.SITE_ADDRESS }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GUIDE_MODEL: ${{ vars.GUIDE_MODEL }}
          GUIDE_DAILY_LIMIT: ${{ vars.GUIDE_DAILY_LIMIT || '2000' }}
          CAMPUS_ADMIN_TOKEN: ${{ secrets.CAMPUS_ADMIN_TOKEN }}
        run: |
          umask 077
          for v in IMAGE_PREFIX IMAGE_TAG SITE_ADDRESS ANTHROPIC_API_KEY GUIDE_MODEL GUIDE_DAILY_LIMIT CAMPUS_ADMIN_TOKEN; do
            printf '%s=%s\n' "$v" "${!v}"
          done > deploy/.env

      - name: 파일 전송
        run: |
          ssh ec2 "mkdir -p $APP_DIR/private"
          scp -q deploy/docker-compose.prod.yml deploy/deploy.sh deploy/make_admin.py deploy/.env "ec2:$APP_DIR/"
          ssh ec2 "chmod 600 $APP_DIR/.env && chmod +x $APP_DIR/deploy.sh"

      - name: 컨테이너 교체
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s\n' "$GHCR_TOKEN" | ssh ec2 "GHCR_USER=${{ github.actor }} bash $APP_DIR/deploy.sh"

      - name: 요약
        if: always()
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          {
            echo "### EC2 배포 ${{ job.status == 'success' && '✅' || '❌' }}"
            echo "- 커밋: \`${SHA::7}\`"
            if [ -n "$SITE_URL" ]; then echo "- 주소: $SITE_URL"; fi
          } >> "$GITHUB_STEP_SUMMARY"
          rm -f ~/.ssh/ec2 deploy/.env
