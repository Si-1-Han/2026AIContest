name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: backend (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run pytest -q
      - name: 파이프라인 산출물·스키마가 커밋된 것과 같은지 확인
        run: |
          uv run python -m campus.pipeline build
          uv run python -m campus.pipeline schema
          git diff --exit-code -- ../web/public/data ../shared/schema \
            || (echo "::error::파이프라인을 다시 실행하고 결과를 커밋하세요." && exit 1)

  web:
    name: web (TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run gen:types:check
      - run: npm run build
